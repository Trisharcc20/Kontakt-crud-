<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacts Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

  <div class="sidebar">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">Kontakt</span>
    </div>
    <nav class="nav">
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Contacts
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="stats-block">
        <div class="stat-item">
          <span class="stat-num" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-item">
          <span class="stat-num" id="activeCount">0</span>
          <span class="stat-label">Active</span>
        </div>
      </div>
    </div>
  </div>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">All Contacts</h1>
        <p class="page-sub">Manage your network</p>
      </div>
      <div class="topbar-right">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search contacts…"/>
        </div>
        <button class="btn-add" id="btnAdd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Contact
        </button>
      </div>
    </header>

    <div class="table-wrap">
      <table class="contacts-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Added</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactsBody">
        </tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span class="empty-icon">◎</span>
        <p>No contacts found</p>
        <small>Try a different search or add a new contact.</small>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Contact</h2>
        <button class="modal-close" id="modalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="error-banner" id="errorBanner" style="display:none;"></div>
        <input type="hidden" id="contactId"/>
        <div class="form-row">
          <div class="form-group">
            <label>Full Name <span class="req">*</span></label>
            <input type="text" id="fieldName" placeholder="e.g. Arjun Sharma"/>
          </div>
          <div class="form-group">
            <label>Email Address <span class="req">*</span></label>
            <input type="email" id="fieldEmail" placeholder="e.g. arjun@example.com"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="fieldPhone" placeholder="e.g. +91 98765 43210"/>
          </div>
          <div class="form-group">
            <label>Role</label>
            <input type="text" id="fieldRole" placeholder="e.g. Developer"/>
          </div>
        </div>
        <div class="form-group">
          <label>Status</label>
          <div class="toggle-wrap">
            <button class="toggle-btn active" data-value="Active" id="toggleActive">Active</button>
            <button class="toggle-btn" data-value="Inactive" id="toggleInactive">Inactive</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btnCancel">Cancel</button>
        <button class="btn-save" id="btnSave">Save Contact</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="modal-overlay" id="deleteOverlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete Contact</h2>
        <button class="modal-close" id="deleteClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="delete-msg">Are you sure you want to delete <strong id="deleteName"></strong>? This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="deleteCancelBtn">Cancel</button>
        <button class="btn-delete-confirm" id="btnConfirmDelete">Yes, Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
